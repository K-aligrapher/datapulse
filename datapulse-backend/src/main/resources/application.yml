server:
  port: 8080

spring:
  profiles:
    active: h2 # Fallback to H2 by default so it runs out-of-the-box, easily switchable to dev
  application:
    name: datapulse-backend

jwt:
  secret: 9a6155383f118b53bc13a0322d71fd9bb566580f1e0cf17c4e5d6d84a7e937d2
  expiration: 86400000 # 1 day in milliseconds

---
# Dev Profile: PostgreSQL & Kafka
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/datapulse
    username: datapulse
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

---
# Local-H2 Profile: Uses H2 database and triggers local data processing simulation
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:datapulsedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
